name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Decide si el PR/push toca codigo o solo documentacion. Los checks del
  # workflow siempre se reportan (nombre estable para proteccion de rama),
  # aunque los jobs de tests se omitan por politica en cambios solo de docs.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!.github/ISSUE_TEMPLATE/**'
              - '!**.md'
              - '!apps/docs/**'
              - '!assets/**'

  api:
    name: 'E2E API'
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy env
        run: cp .env.example .env
      - uses: ./.github/actions/node-install
      - name: Start Services
        run: npm run dx:up
      - uses: ./.github/actions/playwright-install
      - name: Create the database
        run: npm run prisma:migrate-dev
      - name: Seed the database
        run: npm run prisma:seed
      - name: Build app
        run: npx turbo run build --filter=@documenso/remix
      - name: Run API tests
        run: npm run test:e2e:api -w @documenso/app-tests
        env:
          NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
          DANGEROUS_BYPASS_RATE_LIMITS: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api
          path: 'packages/app-tests/**/test-results/*'
          retention-days: 7

  ui:
    name: 'E2E UI (${{ matrix.shard }}/4)'
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Copy env
        run: cp .env.example .env
      - uses: ./.github/actions/node-install
      - name: Start Services
        run: npm run dx:up
      - uses: ./.github/actions/playwright-install
      - name: Create the database
        run: npm run prisma:migrate-dev
      - name: Seed the database
        run: npm run prisma:seed
      - name: Build app
        run: npx turbo run build --filter=@documenso/remix
      - name: Run UI tests
        run: npm run test:e2e:shard -w @documenso/app-tests
        env:
          # Needed since we use next start which will set the NODE_ENV to production
          NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
          DANGEROUS_BYPASS_RATE_LIMITS: 'true'
          PLAYWRIGHT_UI_WORKERS: '4'
          PLAYWRIGHT_SHARD: '${{ matrix.shard }}/4'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ui-${{ matrix.shard }}
          path: 'packages/app-tests/**/test-results/*'
          retention-days: 7

  # Check agregado con NOMBRE ESTABLE: es el que debe exigir la proteccion de
  # rama. Pasa si los tests pasan, y tambien si se omitieron por politica
  # (cambio solo de docs). Falla si cualquier job necesario falla.
  e2e:
    name: 'E2E Tests'
    if: always()
    needs: [changes, api, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Cambio solo de documentacion: E2E omitido por politica (los push a main/develop siempre corren la suite completa)"
            exit 0
          fi
          api="${{ needs.api.result }}"
          ui="${{ needs.ui.result }}"
          echo "api=$api ui=$ui"
          if [ "$api" = "success" ] && [ "$ui" = "success" ]; then
            exit 0
          fi
          exit 1

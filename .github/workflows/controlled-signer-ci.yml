name: Controlled Signer CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  controlled-signer-tdd:
    if: github.head_ref == 'feature/controlled-signer'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/controlled-signer
          fetch-depth: 0

      - uses: ./.github/actions/node-install

      - name: RED - verify tests fail before implementation
        shell: bash
        run: |
          set +e
          npm test -w @documenso/lib -- recipients.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected controlled signer tests to fail before implementation, but they passed."
            exit 1
          fi
          echo "RED confirmed: controlled signer behavior is not implemented yet."

      - name: Align completion-page patch with v2.18
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-controlled_signer.py')
          text = path.read_text(encoding='utf-8')

          start_marker = '''# ---------------------------------------------------------------------------
          # Completion page: hide share/download and show custody-aware copy
          # ---------------------------------------------------------------------------'''
          end_marker = '''# ---------------------------------------------------------------------------
          # Backend: recipient-token download and share restrictions
          # ---------------------------------------------------------------------------'''

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''# ---------------------------------------------------------------------------
          # Completion page: hide share/download and show custody-aware copy
          # ---------------------------------------------------------------------------
          complete_path = "apps/remix/app/routes/_recipient+/sign.$token+/complete.tsx"
          replace(
              complete_path,
              "import { isDocumentCompleted } from '@documenso/lib/utils/document';",
              "import { isDocumentCompleted } from '@documenso/lib/utils/document';\nimport { getRecipientRoleCapabilities, isSigningRecipientRole } from '@documenso/lib/utils/recipients';",
          )
          replace(
              complete_path,
              "  return (\n    <>\n      <RecipientBranding branding={branding} cspNonce={cspNonce} />\n      <div",
              "  const recipientCapabilities = getRecipientRoleCapabilities(recipient.role);\n  const isControlledSigner = recipient.role === RecipientRole.CONTROLLED_SIGNER;\n\n  return (\n    <>\n      <RecipientBranding branding={branding} cspNonce={cspNonce} />\n      <div",
          )
          replace(
              complete_path,
              "              {recipient.role === RecipientRole.SIGNER && <Trans>Document Signed</Trans>}",
              "              {isSigningRecipientRole(recipient.role) && <Trans>Document Signed</Trans>}",
          )
          replace(
              complete_path,
              "<Trans>Everyone has signed! You will receive an email copy of the signed document.</Trans>",
              "{isControlledSigner ? (\n                    <Trans>El documento ha finalizado y permanecerá bajo el control documental del remitente.</Trans>\n                  ) : (\n                    <Trans>Everyone has signed! You will receive an email copy of the signed document.</Trans>\n                  )}",
          )
          replace(
              complete_path,
              """<Trans>
                    All recipients have signed. The document is being processed and you will receive an email copy
                    shortly.
                  </Trans>""",
              """{isControlledSigner ? (
                    <Trans>
                      Todos los destinatarios han firmado. El documento se está procesando y permanecerá bajo el control
                      documental del remitente.
                    </Trans>
                  ) : (
                    <Trans>
                      All recipients have signed. The document is being processed and you will receive an email copy
                      shortly.
                    </Trans>
                  )}""",
          )
          replace(
              complete_path,
              "<Trans>You will receive an email copy of the signed document once everyone has signed.</Trans>",
              "{isControlledSigner ? (\n                    <Trans>Tu firma ha finalizado. Recibirás una notificación cuando el documento esté completo.</Trans>\n                  ) : (\n                    <Trans>You will receive an email copy of the signed document once everyone has signed.</Trans>\n                  )}",
          )
          old_share = """              <DocumentShareButton
                documentId={document.id}
                token={recipient.token}
                className="w-full max-w-none md:flex-1"
              />
          """
          new_share = """              {recipientCapabilities.canShare && (
                <DocumentShareButton
                  documentId={document.id}
                  token={recipient.token}
                  className="w-full max-w-none md:flex-1"
                />
              )}
          """
          replace(complete_path, old_share, new_share)
          replace(
              complete_path,
              "              {isDocumentCompleted(document) && (",
              "              {recipientCapabilities.canDownload && isDocumentCompleted(document) && (",
          )


          '''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Apply controlled signer implementation
        run: python .github/scripts/apply-controlled_signer.py

      - name: Regenerate Prisma client
        run: npm run prisma:generate

      - name: GREEN - run recipient role tests
        run: npm test -w @documenso/lib -- recipients.test.ts

      - name: Build application
        run: npm run build

      - name: Commit implementation to feature branch
        shell: bash
        run: |
          rm -f .github/scripts/apply-controlled_signer.py
          rm -f .github/workflows/controlled-signer-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 1
          fi
          git commit -m "feat: add controlled signer role"
          git push origin HEAD:feature/controlled-signer

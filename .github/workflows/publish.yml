name: Publish Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and publish (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build_and_publish:
    name: Build and publish container
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo docker image prune -a -f || true
          df -h

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        env:
          APP_VERSION: ${{ inputs.tag || '' }}
        run: |
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(git name-rev --tags --name-only "$(git rev-parse HEAD)" | head -n 1 | sed 's/\^0//')"
          fi
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the docker image
        env:
          NEXT_PRIVATE_TELEMETRY_KEY: ${{ secrets.NEXT_PRIVATE_TELEMETRY_KEY }}
          NEXT_PRIVATE_TELEMETRY_HOST: ${{ secrets.NEXT_PRIVATE_TELEMETRY_HOST }}
        run: |
          docker build \
            -f ./docker/Dockerfile \
            --progress=plain \
            --build-arg NEXT_PRIVATE_TELEMETRY_KEY="${NEXT_PRIVATE_TELEMETRY_KEY:-}" \
            --build-arg NEXT_PRIVATE_TELEMETRY_HOST="${NEXT_PRIVATE_TELEMETRY_HOST:-}" \
            -t "$IMAGE_NAME:$GIT_SHA" \
            -t "$IMAGE_NAME:$APP_VERSION" \
            .

      - name: Tag stable releases as latest
        run: |
          if [[ "$APP_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-cidein\.[0-9]+)?$ ]]; then
            docker tag "$IMAGE_NAME:$APP_VERSION" "$IMAGE_NAME:latest"
          fi

      - name: Push the docker image to GitHub Container Registry
        run: docker push --all-tags "$IMAGE_NAME"
